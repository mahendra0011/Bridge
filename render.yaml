# Render.com Blueprint deployment configuration for Bridge
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── BACKEND WEB SERVICE ───────────────────────────────────────────────────
  - type: web
    name: bridge-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # MongoDB Atlas connection string (mongodb+srv://...)
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure 256-bit secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BREVO_API_KEY
        sync: false          # Brevo transactional API key for email OTP/verification
      - key: EMAIL_FROM
        sync: false          # Verified sender email e.g. Bridge <no-reply@yourdomain.com>
      - key: CLIENT_URL
        sync: false          # Frontend URL (Render static site or Vercel URL)
      - key: ADMIN_EMAIL
        sync: false          # Admin user email for seed:admin
      - key: ADMIN_PASSWORD
        sync: false          # Admin user password for seed:admin
      - key: ADMIN_NAME
        value: Admin
      - key: CLOUDINARY_CLOUD_NAME
        sync: false          # Optional: Cloudinary cloud name for persistent uploads
      - key: CLOUDINARY_API_KEY
        sync: false          # Optional: Cloudinary API key
      - key: CLOUDINARY_API_SECRET
        sync: false          # Optional: Cloudinary API secret

  # ─── FRONTEND STATIC SITE ──────────────────────────────────────────────────
  - type: web
    name: bridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to backend URL: https://bridge-backend.onrender.com
